[project]
name = "storyline-mcp"
version = "0.1.0"
description = "MCP server for reading and editing Articulate Storyline .story files"
requires-python = ">=3.10"
# Pillow, alani dolduran gorselleri KIRPMAK icin (media._cover_crop).
# Yoksa kod calisir ve sigdirmaya duser -- bozulmus bir kapak yerine
# kenarda bosluk kalir; yani eksikligi bir kusur degil, bir kayip.
dependencies = ["mcp[cli]>=1.2.0", "pillow>=10.0"]

[project.scripts]
storyline-mcp = "storyline_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyline_mcp"]

# Seed shapes are data, not code: without them an empty project has nothing to
# clone and cannot grow its first text box.
[tool.hatch.build.targets.wheel.force-include]
"storyline_mcp/seeds" = "storyline_mcp/seeds"
