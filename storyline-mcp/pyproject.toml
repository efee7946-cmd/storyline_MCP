[project]
name = "storyline-mcp"
version = "0.1.0"
description = "MCP server for reading and editing Articulate Storyline .story files"
requires-python = ">=3.10"
# Pillow, alani dolduran gorselleri KIRPMAK icin (media._cover_crop).
# Yoksa kod calisir ve sigdirmaya duser -- bozulmus bir kapak yerine
# kenarda bosluk kalir; yani eksikligi bir kusur degil, bir kayip.
#
# mcp TABANI SERT BIR TABAN, tercih degil. server.py `from mcp.server.mcpserver
# import MCPServer` diyor ve o modul YALNIZCA 2.x'te var. Olculdu 2026-09-04,
# PyPI tekerleri acilip icine bakilarak: 1.29.1'de mcpserver YOK/fastmcp VAR,
# 2.0.0'da tam tersi -- yani 1.x ile 2.x arasindaki fark bir surum atlamasi
# degil, modulun yer degistirmesi.
#
# Taban bir sure >=1.2.0 yaziyordu ve bu SESSIZ bir tuzakti: cozucu 1.x'e
# dustugunde `pip install` BASARIYLA biter, hicbir uyari cikmaz, hata ancak
# sunucu ilk kez calistirildiginda ImportError olarak gorunur. Yani kurulumun
# kusuru kullanmanin kusuru gibi okunur.
dependencies = ["mcp[cli]>=2.0", "pillow>=10.0"]

# Panel AYRI BIR EKSTRA, ama BEYAN EDILMIS bir ekstra. pywebview bir sure
# yalnizca README'de elle atilacak bir satirdi ve bu, panelin ana giris
# noktasi olmasiyla birlesince sessiz bir tuzak uretiyordu: `pip install -e .`
# yapip `Storyline Panel.bat`e cift tiklayan biri HICBIR SEY gormuyor.
# Sebebi README'nin kendisinde yazili -- pythonw.exe surece stdout/stderr
# vermez, dolayisiyla eksik modulun ImportError'i hicbir yere dusmez.
# Olculdu 2026-08-29, temiz klonda: panel/app.py -> ModuleNotFoundError:
# No module named 'webview'.
#
# Zorunlu bagimlilik YAPILMADI: paketin ilan ettigi is MCP sunucusu ve
# pywebview yaninda native WebView2 baglar. Ekstra olmasi ikisini de korur --
# sunucu sade kalir, panel tek komutla kurulur.
[project.optional-dependencies]
panel = ["pywebview>=4.0"]

[project.scripts]
storyline-mcp = "storyline_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyline_mcp"]

# Seed shapes are data, not code: without them an empty project has nothing to
# clone and cannot grow its first text box.
[tool.hatch.build.targets.wheel.force-include]
"storyline_mcp/seeds" = "storyline_mcp/seeds"
